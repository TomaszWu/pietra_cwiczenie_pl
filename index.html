<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Generator budynku</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #667085;
      --border: #d0d5dd;
      --soft: #eef2f6;
      --accent: #2f6fed;
      --accent-hover: #255ed0;
      --target: #fff7ed;
      --target-border: #fb923c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 20px 24px 40px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 30px;
      line-height: 1.2;
      font-weight: 800;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 20px;
      align-items: start;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    button {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 16px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }

    button:hover { background: #f9fafb; }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      font-weight: 700;
    }

    button.primary:hover { background: var(--accent-hover); }

    .building {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .floor {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 12px;
      align-items: stretch;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      min-height: 94px;
    }

    .floor-label {
      background: var(--soft);
      border-radius: 9px;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 800;
      font-size: 16px;
      padding: 10px;
    }

    .rooms {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      align-content: center;
      min-height: 72px;
    }

    .room {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 12px;
      background: #fff;
      font-weight: 600;
      transition: .15s ease;
    }

    .room.highlight {
      border-color: var(--target-border);
      background: var(--target);
      outline: 2px solid rgba(251,146,60,.13);
    }

    .side-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    .side-card h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .help {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .field { margin-bottom: 16px; }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 700;
    }

    input[type="number"] {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      font: inherit;
      background: #fff;
      color: var(--text);
    }

    textarea {
      width: 100%;
      min-height: 270px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font: inherit;
      line-height: 1.45;
      background: #fff;
      color: var(--text);
    }

    .status {
      min-height: 18px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .target-box {
      display: none;
      margin-bottom: 14px;
      background: var(--target);
      border: 1px solid var(--target-border);
      border-radius: 12px;
      padding: 13px 15px;
    }

    .target-box.visible { display: block; }

    .target-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 4px;
    }

    .target-word {
      font-weight: 800;
      font-size: 22px;
    }

    @media (max-width: 850px) {
      .layout { grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
      .wrap { padding: 14px; }
      .floor { grid-template-columns: 1fr; }
      .floor-label { min-height: auto; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Generator budynku</h1>

    <div class="layout">
      <section>
        <div class="controls">
          <button class="primary" id="shuffleBtn" type="button">🎲 Losuj nowy budynek</button>
          <button id="targetBtn" type="button">🎯 Wylosuj miejsce do opisania</button>
          <button id="clearTargetBtn" type="button">Wyczyść zaznaczenie</button>
        </div>

        <div id="targetBox" class="target-box" aria-live="polite">
          <div class="target-label">Opisz, gdzie to jest:</div>
          <div id="targetWord" class="target-word"></div>
        </div>

        <div id="building" class="building" aria-live="polite"></div>
      </section>

      <aside class="side-card">
        <h2>Ustawienia</h2>

        <div class="field">
          <label for="floorsInput">Liczba pięter</label>
          <input id="floorsInput" type="number" min="1" max="10" step="1" value="3" />
        </div>

        <h2>Słownictwo</h2>
        <p class="help">Jedno hasło w jednej linii. Po zmianie listy kliknij „Zastosuj listę”.</p>

        <textarea id="wordsInput">strych
garaż
sekretariat
rowerownia
kancelaria
pralnia
magazyn
komórka lokatorska
szatnia
szkoła językowa
toaleta
wózkownia
korytarz
hol
klatka schodowa
winda
schody
wejście
wyjście
piwnica</textarea>

        <div class="controls" style="margin-top:10px;margin-bottom:0">
          <button id="applyBtn" type="button">Zastosuj listę</button>
        </div>

        <div id="status" class="status" aria-live="polite"></div>
      </aside>
    </div>
  </main>

  <script>
    (() => {
      const buildingEl = document.getElementById("building");
      const wordsInput = document.getElementById("wordsInput");
      const floorsInput = document.getElementById("floorsInput");
      const status = document.getElementById("status");
      const targetBox = document.getElementById("targetBox");
      const targetWord = document.getElementById("targetWord");

      function parseWords() {
        return wordsInput.value
          .split(/\r?\n|,/)
          .map(s => s.trim())
          .filter(Boolean)
          .slice(0, 100);
      }

      function clampFloorCount(value) {
        let n = Number.parseInt(value, 10);
        if (!Number.isFinite(n)) n = 3;
        return Math.max(1, Math.min(10, n));
      }

      function buildLevels(count) {
        const generated = [];

        for (let i = count; i >= 1; i--) {
          generated.push({ label: i + ". PIĘTRO" });
        }

        generated.push({ label: "PARTER" });
        generated.push({ label: "PIWNICA" });

        return generated;
      }

      function shuffle(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      let words = parseWords();
      let floorCount = clampFloorCount(floorsInput.value);
      let levels = buildLevels(floorCount);
      let assignment = [];
      let currentTarget = null;

      function distribute() {
        levels = buildLevels(floorCount);
        assignment = levels.map(() => []);

        // "strych" zawsze trafia na najwyższe piętro.
        const atticWords = words.filter(word => word.toLowerCase() === "strych");
        const otherWords = words.filter(word => word.toLowerCase() !== "strych");
        const mixed = shuffle(otherWords);

        if (atticWords.length > 0) {
          assignment[0].push("strych");
        }

        // Pozostałe hasła losujemy między wszystkimi poziomami.
        mixed.forEach((word, index) => {
          assignment[index % levels.length].push(word);
        });

        currentTarget = null;
        targetBox.classList.remove("visible");
        renderBuilding();
      }

      function renderBuilding() {
        buildingEl.innerHTML = "";

        levels.forEach((level, index) => {
          const row = document.createElement("section");
          row.className = "floor";

          const label = document.createElement("div");
          label.className = "floor-label";
          label.textContent = level.label;

          const rooms = document.createElement("div");
          rooms.className = "rooms";

          const items = assignment[index] || [];

          if (!items.length) {
            const empty = document.createElement("span");
            empty.textContent = "—";
            empty.style.color = "#667085";
            rooms.appendChild(empty);
          } else {
            items.forEach(word => {
              const room = document.createElement("span");
              room.className = "room";
              room.textContent = word;

              if (word === currentTarget) {
                room.classList.add("highlight");
              }

              rooms.appendChild(room);
            });
          }

          row.appendChild(label);
          row.appendChild(rooms);
          buildingEl.appendChild(row);
        });
      }

      function chooseTarget() {
        if (!words.length) return;

        currentTarget = words[Math.floor(Math.random() * words.length)];
        targetWord.textContent = currentTarget;
        targetBox.classList.add("visible");
        renderBuilding();
      }

      function clearTarget() {
        currentTarget = null;
        targetBox.classList.remove("visible");
        renderBuilding();
      }

      function applySettings() {
        const newWords = parseWords();
        const newFloorCount = clampFloorCount(floorsInput.value);

        floorsInput.value = newFloorCount;

        if (newWords.length < 3) {
          status.textContent = "Dodaj co najmniej 3 hasła.";
          return;
        }

        words = newWords;
        floorCount = newFloorCount;
        status.textContent = "Gotowe: " + floorCount + " pięter + parter + piwnica, " + words.length + " haseł.";
        distribute();
      }

      document.getElementById("shuffleBtn").addEventListener("click", distribute);
      document.getElementById("targetBtn").addEventListener("click", chooseTarget);
      document.getElementById("clearTargetBtn").addEventListener("click", clearTarget);
      document.getElementById("applyBtn").addEventListener("click", applySettings);

      floorsInput.addEventListener("change", () => {
        floorCount = clampFloorCount(floorsInput.value);
        floorsInput.value = floorCount;
        distribute();
      });

      distribute();
    })();
  </script>
</body>
</html>
